# Despliegue de Kisses and Paws Board and Care.
#
# El vite.config de Lovable genera por defecto un bundle de Cloudflare. Aqui se
# fuerza el formato de Netlify con NITRO_PRESET, que es lo que cambia la salida
# a dist/ mas la funcion de servidor en .netlify/functions-internal/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

# A proposito no se declara [functions]: Nitro escribe la funcion de servidor en
# .netlify/functions-internal, que Netlify recoge por su cuenta. Declararlo como
# directorio de funciones del usuario solo abre la puerta a que lo empaquete mal.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Las fotos y videos llevan nombre fijo y no cambian: se cachean fuerte para que
# el sitio cargue rapido en visitas repetidas.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
